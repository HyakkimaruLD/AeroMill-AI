[theme]
base = "dark"
primaryColor = "#4f86c6"
backgroundColor = "#111213"
secondaryBackgroundColor = "#191b1d"
textColor = "#e8e6e1"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[server]
# no first-run e-mail prompt and no auto-opened tab; open http://localhost:8501 yourself
headless = true
